<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ddtui remote</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #191a16;
      --panel: #24251f;
      --panel-2: #2d2e27;
      --line: #55533f;
      --text: #f8f8f2;
      --muted: #a59f85;
      --cyan: #66d9ef;
      --green: #a6e22e;
      --yellow: #e6db74;
      --red: #f92672;
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }
    button, input, textarea {
      font: inherit;
      color: inherit;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    button {
      cursor: pointer;
      padding: 8px 10px;
      background: #35362e;
      min-height: 38px;
      white-space: nowrap;
    }
    button:hover { border-color: var(--cyan); }
    button.primary { color: #111; background: var(--cyan); border-color: var(--cyan); }
    button.warn { color: #111; background: var(--yellow); border-color: var(--yellow); }
    input, textarea {
      width: 100%;
      padding: 9px 10px;
      outline: none;
      min-height: 38px;
    }
    textarea {
      min-height: 92px;
      resize: vertical;
    }
    .mobile-tabs {
      display: none;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 20;
      max-width: min(92vw, 620px);
      transform: translateX(-50%) translateY(12px);
      opacity: 0;
      pointer-events: none;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #303129;
      color: var(--text);
      transition: opacity 120ms ease, transform 120ms ease;
    }
    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .app {
      display: grid;
      grid-template-columns: 310px 1fr;
      height: 100vh;
      min-height: 100dvh;
    }
    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 650;
    }
    .login {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }
    .sessions {
      overflow: auto;
      padding: 8px;
      display: grid;
      gap: 8px;
      min-height: 0;
    }
    .session {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      text-align: left;
    }
    .session.active { border-color: var(--cyan); }
    .session .id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--cyan);
      word-break: break-all;
    }
    .session .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
      word-break: break-word;
    }
    main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100vh;
      min-height: 100dvh;
    }
    .status {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .pill {
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .pill.online { color: var(--green); border-color: var(--green); }
    .pill.busy { color: var(--yellow); border-color: var(--yellow); }
    .log {
      overflow: auto;
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 10px;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: min(980px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-wrap: anywhere;
      background: var(--panel);
    }
    .msg.user { border-color: #75715e; }
    .msg.assistant { border-color: #3f6f46; }
    .msg.tool { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .msg.reasoning { color: var(--muted); border-style: dashed; }
    details.msg.foldable {
      padding: 0;
    }
    details.msg.foldable summary {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      list-style: none;
      user-select: none;
    }
    details.msg.foldable summary::-webkit-details-marker {
      display: none;
    }
    details.msg.foldable summary::before {
      content: ">";
      color: var(--cyan);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    details.msg.foldable[open] summary::before {
      content: "v";
    }
    details.msg.foldable[open] summary {
      border-bottom: 1px dashed var(--line);
    }
    details.msg.foldable summary .role {
      margin-bottom: 0;
    }
    details.msg.foldable .msg-text {
      padding: 10px 12px;
    }
    .fold-count {
      color: var(--muted);
    }
    .role {
      font-size: 12px;
      color: var(--cyan);
      margin-bottom: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .msg-text {
      white-space: pre-wrap;
    }
    .msg-text.markdown {
      white-space: normal;
    }
    .msg-text.markdown > :first-child { margin-top: 0; }
    .msg-text.markdown > :last-child { margin-bottom: 0; }
    .msg-text.markdown p,
    .msg-text.markdown ul,
    .msg-text.markdown ol,
    .msg-text.markdown blockquote,
    .msg-text.markdown pre {
      margin: 8px 0;
    }
    .msg-text.markdown h1,
    .msg-text.markdown h2,
    .msg-text.markdown h3,
    .msg-text.markdown h4 {
      margin: 12px 0 8px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .msg-text.markdown h1 { font-size: 20px; }
    .msg-text.markdown h2 { font-size: 18px; }
    .msg-text.markdown h3 { font-size: 16px; }
    .msg-text.markdown h4 { font-size: 15px; }
    .msg-text.markdown ul,
    .msg-text.markdown ol {
      padding-left: 1.35rem;
    }
    .msg-text.markdown li {
      margin: 3px 0;
    }
    .msg-text.markdown blockquote {
      border-left: 3px solid var(--line);
      color: var(--muted);
      padding-left: 10px;
    }
    .msg-text.markdown code {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #191a16;
      padding: 1px 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }
    .msg-text.markdown pre {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #191a16;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .msg-text.markdown pre code {
      display: block;
      border: 0;
      background: transparent;
      padding: 0;
      white-space: pre;
    }
    .msg-text.markdown a {
      color: var(--cyan);
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    .composer {
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .terminal {
      border-top: 1px solid var(--line);
      padding-top: 8px;
      display: grid;
      gap: 8px;
    }
    .terminal summary {
      cursor: pointer;
      color: var(--muted);
      list-style-position: inside;
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .terminal summary::marker { color: var(--cyan); }
    .terminal select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
    }
    @media (max-width: 820px) {
      body { height: 100dvh; }
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100dvh;
      }
      .mobile-tabs {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        border-bottom: 1px solid var(--line);
        background: var(--line);
      }
      .mobile-tabs button {
        min-width: 0;
        border: 0;
        border-radius: 0;
        background: var(--panel);
        color: var(--muted);
        padding: 9px 4px;
      }
      .mobile-tabs button.active {
        color: #111;
        background: var(--cyan);
      }
      aside {
        grid-row: 2;
        border-right: 0;
        border-bottom: 0;
        min-height: 0;
        overflow: auto;
      }
      header {
        padding: 8px 10px;
      }
      h1 { font-size: 15px; }
      #refreshBtn { padding-inline: 9px; }
      .login {
        padding: 8px 10px;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 6px;
      }
      .login .actions {
        display: contents;
      }
      .login button {
        padding-inline: 8px;
      }
      .sessions {
        display: grid;
        gap: 8px;
        overflow: auto;
        padding: 10px;
        -webkit-overflow-scrolling: touch;
      }
      .session {
        padding: 8px 9px;
      }
      .session .id {
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        word-break: normal;
      }
      .session .meta {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        word-break: normal;
      }
      main {
        grid-row: 2;
        height: auto;
        min-height: 0;
      }
      .status {
        padding: 7px 10px;
        gap: 6px;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
      }
      body[data-mobile-tab="chat"] aside,
      body[data-mobile-tab="chat"] .status,
      body[data-mobile-tab="chat"] .terminal {
        display: none;
      }
      body[data-mobile-tab="chat"] main {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
      }
      body[data-mobile-tab="sessions"] main,
      body[data-mobile-tab="status"] aside,
      body[data-mobile-tab="terminal"] aside {
        display: none;
      }
      body[data-mobile-tab="sessions"] aside {
        display: flex;
      }
      body[data-mobile-tab="status"] main {
        display: grid;
        grid-template-rows: minmax(0, 1fr);
      }
      body[data-mobile-tab="status"] .status {
        display: flex;
        align-content: start;
        align-items: flex-start;
        border-bottom: 0;
        flex-wrap: wrap;
        gap: 8px;
        overflow: auto;
        padding: 12px;
      }
      body[data-mobile-tab="status"] .log,
      body[data-mobile-tab="status"] .composer {
        display: none;
      }
      body[data-mobile-tab="terminal"] main {
        display: grid;
        grid-template-rows: minmax(0, 1fr);
      }
      body[data-mobile-tab="terminal"] .status,
      body[data-mobile-tab="terminal"] .log,
      body[data-mobile-tab="terminal"] .composer > textarea,
      body[data-mobile-tab="terminal"] .composer > .actions {
        display: none;
      }
      body[data-mobile-tab="terminal"] .composer {
        border-top: 0;
        align-content: start;
        overflow: auto;
      }
      body[data-mobile-tab="terminal"] .terminal {
        display: grid;
        border-top: 0;
      }
      .log {
        padding: 10px;
        gap: 8px;
      }
      .msg {
        padding: 9px 10px;
        font-size: 13px;
      }
      .role {
        font-size: 11px;
        margin-bottom: 4px;
      }
      .composer {
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        gap: 7px;
      }
      textarea {
        min-height: 68px;
        max-height: 28dvh;
      }
      .composer > .actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }
      .composer > .actions button {
        padding: 8px 4px;
        min-width: 0;
      }
      .terminal {
        padding-top: 4px;
        gap: 6px;
      }
      .terminal summary {
        display: none;
      }
      .terminal .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .terminal select,
      .terminal input {
        min-height: 40px;
      }
    }
    @media (max-width: 420px) {
      body { font-size: 13px; }
      .login {
        grid-template-columns: 1fr auto;
      }
      .login .actions {
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: 1fr 1fr;
      }
      .composer > .actions {
        grid-template-columns: 1fr 1fr;
      }
      .terminal .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="mobile-tabs" aria-label="Mobile sections">
      <button type="button" class="active" data-mobile-tab="chat">Chat</button>
      <button type="button" data-mobile-tab="sessions">Sessions</button>
      <button type="button" data-mobile-tab="status">Status</button>
      <button type="button" data-mobile-tab="terminal">Terminal</button>
    </nav>
    <aside>
      <header>
        <h1>ddtui remote</h1>
        <button id="refreshBtn">Refresh</button>
      </header>
      <section class="login">
        <input id="tokenInput" type="password" placeholder="Login token">
        <div class="actions">
          <button id="connectBtn" class="primary">Connect</button>
          <button id="logoutBtn">Logout</button>
        </div>
      </section>
      <section id="sessions" class="sessions"></section>
    </aside>
    <main>
      <section id="status" class="status">
        <span class="pill">disconnected</span>
      </section>
      <section id="log" class="log"></section>
      <section class="composer">
        <textarea id="input" placeholder="Message this active ddtui session"></textarea>
        <div class="actions">
          <button id="sendBtn" class="primary">Send</button>
          <button id="steerBtn">Steer</button>
          <button id="interruptBtn" class="warn">Interrupt</button>
          <button id="snapshotBtn">Snapshot</button>
          <button id="newSessionBtn" class="warn">New session</button>
        </div>
        <details class="terminal">
          <summary>Terminal</summary>
          <select id="terminalSelect"></select>
          <input id="terminalInput" placeholder="Terminal input, include Enter by pressing the button">
          <div class="actions">
            <button id="terminalReadBtn">Read Terminal</button>
            <button id="terminalSendBtn">Send Terminal Text</button>
          </div>
        </details>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script>
    const els = {
      token: document.getElementById("tokenInput"),
      connect: document.getElementById("connectBtn"),
      logout: document.getElementById("logoutBtn"),
      refresh: document.getElementById("refreshBtn"),
      sessions: document.getElementById("sessions"),
      status: document.getElementById("status"),
      log: document.getElementById("log"),
      input: document.getElementById("input"),
      send: document.getElementById("sendBtn"),
      steer: document.getElementById("steerBtn"),
      interrupt: document.getElementById("interruptBtn"),
      snapshot: document.getElementById("snapshotBtn"),
      newSession: document.getElementById("newSessionBtn"),
      terminalSelect: document.getElementById("terminalSelect"),
      terminalInput: document.getElementById("terminalInput"),
      terminalRead: document.getElementById("terminalReadBtn"),
      terminalSend: document.getElementById("terminalSendBtn"),
      terminalPanel: document.querySelector(".terminal"),
      toast: document.getElementById("toast"),
      mobileTabs: document.querySelectorAll("[data-mobile-tab]"),
    };

    let ws = null;
    let sessions = [];
    let activeSession = "";
    let activeStatus = null;
    let messages = [];
    let streaming = null;
    let clientId = `web-${Math.random().toString(16).slice(2)}`;
    let lastSeq = 0;
    let toastTimer = null;
    let reconnectTimer = null;
    let reconnectAttempt = 0;
    let manualDisconnect = false;
    let streamingNodes = null;
    let streamingRenderFrame = 0;
    // Set while a "clear" command is in flight: the session re-registers
    // under a NEW session_id, so we watch sessions.list broadcasts for an
    // online id we have not seen before and auto-switch to it.
    let pendingNewSession = null;

    document.body.dataset.mobileTab = "chat";
    els.token.value = localStorage.getItem("ddtuiRemoteToken") || "";

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const token = encodeURIComponent(els.token.value.trim());
      return `${proto}//${location.host}/ws/control?token=${token}`;
    }

    function connect() {
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      const token = els.token.value.trim();
      if (!token) return notice("Enter the login token first.");
      clearReconnect();
      manualDisconnect = false;
      localStorage.setItem("ddtuiRemoteToken", token);
      ws = new WebSocket(wsUrl());
      ws.onopen = () => {
        reconnectAttempt = 0;
        notice("connected");
        sendRaw({ kind: "list_sessions" });
        if (activeSession) {
          sendRaw({ kind: "subscribe", session_id: activeSession, after_seq: lastSeq });
          command("snapshot");
        }
      };
      ws.onmessage = (event) => handleMessage(JSON.parse(event.data));
      ws.onclose = () => {
        notice("disconnected");
        scheduleReconnect();
      };
      ws.onerror = () => notice("socket error");
    }

    function clearReconnect() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
    }

    function scheduleReconnect() {
      clearReconnect();
      if (manualDisconnect || !els.token.value.trim()) return;
      reconnectAttempt += 1;
      const delay = Math.min(30000, 1000 * Math.pow(1.6, reconnectAttempt - 1));
      notice(`reconnect in ${Math.ceil(delay / 1000)}s`);
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect();
      }, delay);
    }

    function sendRaw(message) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        notice("not connected");
        return;
      }
      ws.send(JSON.stringify(message));
    }

    function command(type, payload = {}) {
      if (!activeSession) {
        notice("select a session first");
        return null;
      }
      const commandId = `cmd-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      sendRaw({
        kind: "command",
        type,
        session_id: activeSession,
        command_id: commandId,
        client_id: clientId,
        payload,
      });
      return commandId;
    }

    function handleMessage(message) {
      if (message.seq) lastSeq = Math.max(lastSeq, Number(message.seq) || 0);
      if (message.kind === "sessions.list") {
        sessions = message.sessions || [];
        if (pendingNewSession && Date.now() > pendingNewSession.until) {
          pendingNewSession = null;
        }
        if (pendingNewSession) {
          const fresh = sessions.find(
            (s) => s.online && !pendingNewSession.known.has(s.session_id)
          );
          if (fresh) {
            pendingNewSession = null;
            notice("switched to the new session");
            renderSessions();
            selectSession(fresh.session_id);
            return;
          }
        }
        if (activeSession && !sessions.some((s) => s.session_id === activeSession)) {
          activeSession = "";
          activeStatus = null;
          messages = [];
          streaming = null;
          streamingNodes = null;
          if (pendingNewSession) {
            // The old id just went offline mid-clear; stay on the chat
            // tab and wait for the re-registration broadcast.
            notice("waiting for the new session…");
          } else {
            notice("session disconnected");
            setMobileTab("sessions");
          }
          renderStatus();
          renderMessages();
        }
        renderSessions();
        return;
      }
      if (message.kind === "command_ack") {
        notice(`${message.status}: ${message.message || message.command_id || ""}`);
        if (
          pendingNewSession &&
          message.command_id === pendingNewSession.cmdId &&
          message.status === "error"
        ) {
          // clear refused (e.g. session busy) — stop watching.
          pendingNewSession = null;
        }
        if (message.payload && message.payload.result) {
          appendMessage("tool", message.payload.result);
        }
        return;
      }
      if (message.kind === "error") {
        notice(message.message || "error");
        return;
      }
      if (message.kind !== "event") return;
      if (message.session_id && message.session_id !== activeSession) return;
      const payload = message.payload || {};
      if (message.type === "session.snapshot") {
        const snap = payload.messages ? payload : payload;
        activeStatus = snap.status || activeStatus;
        messages = snap.messages || [];
        streaming = null;
        streamingNodes = null;
        renderStatus();
        renderMessages();
      } else if (message.type === "status.changed") {
        activeStatus = (payload.status || payload);
        renderStatus();
      } else if (message.type === "message.append") {
        const appended = payload.message || null;
        if (streaming && appended && appended.role === "assistant") {
          messages.push(appended);
          streaming = null;
          streamingNodes = null;
          renderMessages();
        } else {
          if (streaming) {
            messages.push(streaming);
            streaming = null;
            streamingNodes = null;
          }
          if (appended) {
            messages.push(appended);
            renderMessage(appended);
            scrollLogToEnd();
          }
        }
      } else if (message.type === "assistant.delta") {
        const kind = payload.kind || "content";
        if (!streaming || streaming.role !== "assistant") {
          streaming = { role: "assistant", content: "", reasoning_content: "" };
          streamingNodes = null;
        }
        if (kind === "reasoning") {
          streaming.reasoning_content += payload.text || "";
        } else {
          streaming.content += payload.text || "";
        }
        appendStreamingDelta(kind, payload.text || "");
      } else if (message.type === "terminal.tail") {
        appendMessage("tool", `[${payload.terminal_id}] ${payload.tail || ""}`);
      } else if (message.type === "session.offline") {
        if (!message.session_id || message.session_id === activeSession) {
          activeSession = "";
          activeStatus = null;
          messages = [];
          streaming = null;
          streamingNodes = null;
          notice("session disconnected");
          setMobileTab("sessions");
          renderStatus();
          renderMessages();
        }
      } else if (message.type === "remote.input" || message.type === "tool.started") {
        appendMessage("tool", `${message.type}: ${JSON.stringify(payload)}`);
      }
    }

    function renderSessions() {
      els.sessions.innerHTML = "";
      for (const session of sessions) {
        const btn = document.createElement("button");
        btn.className = `session${session.session_id === activeSession ? " active" : ""}`;
        btn.innerHTML = `
          <div class="id">${escapeHtml(session.session_id)}</div>
          <div class="meta">${session.online ? "online" : "offline"} · ${escapeHtml(session.model || "-")} · ${session.busy ? "busy" : "idle"}</div>
          <div class="meta">${escapeHtml(session.cwd || "")}</div>
        `;
        btn.onclick = () => selectSession(session.session_id);
        els.sessions.appendChild(btn);
      }
    }

    function selectSession(sessionId) {
      activeSession = sessionId;
      messages = [];
      streaming = null;
      streamingNodes = null;
      lastSeq = 0;
      renderSessions();
      renderMessages();
      sendRaw({ kind: "subscribe", session_id: sessionId, after_seq: -1 });
      command("snapshot");
      setMobileTab("chat");
    }

    function renderStatus() {
      if (!activeStatus) {
        els.status.innerHTML = `<span class="pill">no session</span>`;
        renderTerminals([]);
        return;
      }
      const terminals = activeStatus.terminals || [];
      els.status.innerHTML = `
        <span class="pill online">${escapeHtml(activeStatus.session_id || activeSession)}</span>
        <span class="pill ${activeStatus.busy ? "busy" : ""}">${activeStatus.busy ? "busy" : "idle"}</span>
        <span class="pill">${escapeHtml(activeStatus.provider || "")} ${escapeHtml(activeStatus.model || "")}</span>
        <span class="pill">queue ${activeStatus.queued || 0}</span>
        <span class="pill">steer ${activeStatus.steer || 0}</span>
        <span class="pill">terminal_send ${activeStatus.terminal_send_enabled ? "on" : "off"}</span>
      `;
      renderTerminals(terminals);
    }

    function renderTerminals(terminals) {
      const previous = els.terminalSelect.value;
      els.terminalSelect.innerHTML = "";
      if (!terminals.length) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "No terminals";
        els.terminalSelect.appendChild(opt);
        return;
      }
      for (const term of terminals) {
        const opt = document.createElement("option");
        opt.value = term.id;
        opt.textContent = `${term.id} ${term.name || ""} ${term.status || ""}`;
        els.terminalSelect.appendChild(opt);
      }
      if (previous) els.terminalSelect.value = previous;
    }

    function renderMessages() {
      els.log.innerHTML = "";
      streamingNodes = null;
      const all = streaming ? [...messages, streaming] : messages;
      for (const message of all) {
        renderMessage(message);
      }
      scrollLogToEnd();
    }

    function renderMessage(message) {
      const role = message.role || "event";
      if (message.reasoning_content) {
        appendMessageBlock("reasoning", message.reasoning_content, "reasoning");
      }
      let content = message.content || "";
      if (content || !message.tool_calls) {
        appendMessageBlock(role, content, role);
      }
      if (message.tool_calls) {
        appendMessageBlock("tool", JSON.stringify(message.tool_calls, null, 2), "tool");
      }
    }

    function appendMessageBlock(role, content, className = role) {
      const block = createMessageBlock(role, content, className);
      els.log.appendChild(block.root);
      return block;
    }

    function createMessageBlock(role, content = "", className = role) {
      if (role === "reasoning" || role === "tool") {
        return createFoldableBlock(role, content || "", className);
      }
      const root = document.createElement("div");
      root.className = `msg ${className}`;
      const roleEl = document.createElement("div");
      roleEl.className = "role";
      roleEl.textContent = role;
      const textEl = document.createElement("div");
      textEl.className = "msg-text";
      renderMessageText(textEl, content || "", role);
      root.append(roleEl, textEl);
      return { root, text: textEl };
    }

    function createFoldableBlock(role, content = "", className = role) {
      const root = document.createElement("details");
      root.className = `msg ${className} foldable`;
      root.open = !isMobileComposer();
      const summary = document.createElement("summary");
      const label = document.createElement("span");
      label.className = "role";
      label.textContent = role;
      const count = document.createElement("span");
      count.className = "fold-count";
      summary.append(label, count);
      const textEl = document.createElement("div");
      textEl.className = "msg-text";
      renderMessageText(textEl, content, role);
      root.append(summary, textEl);
      updateFoldCount(count, content);
      return { root, text: textEl, count };
    }

    function renderMessageText(target, content, role) {
      if (role === "assistant") {
        target.classList.add("markdown");
        target.innerHTML = markdownToHtml(content || "");
      } else {
        target.classList.remove("markdown");
        target.textContent = content || "";
      }
    }

    function updateFoldCount(target, content) {
      if (!target) return;
      target.textContent = `${formatCount(charCount(content || ""))} chars`;
    }

    function charCount(value) {
      return Array.from(String(value || "")).length;
    }

    function formatCount(value) {
      return new Intl.NumberFormat().format(value);
    }

    function markdownToHtml(markdown) {
      const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let paragraph = [];
      let listType = "";
      let listItems = [];
      let inFence = false;
      let fenceLang = "";
      let fenceLines = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph = [];
      }

      function flushList() {
        if (!listItems.length) return;
        const tag = listType === "ol" ? "ol" : "ul";
        html.push(`<${tag}>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</${tag}>`);
        listType = "";
        listItems = [];
      }

      function flushFence() {
        const langClass = fenceLang ? ` class="language-${escapeAttr(fenceLang)}"` : "";
        html.push(`<pre><code${langClass}>${escapeHtml(fenceLines.join("\n"))}</code></pre>`);
        inFence = false;
        fenceLang = "";
        fenceLines = [];
      }

      for (const line of lines) {
        const trimmed = line.trim();
        if (inFence) {
          if (/^```/.test(trimmed)) {
            flushFence();
          } else {
            fenceLines.push(line);
          }
          continue;
        }

        const fence = trimmed.match(/^```([A-Za-z0-9_-]+)?\s*$/);
        if (fence) {
          flushParagraph();
          flushList();
          inFence = true;
          fenceLang = fence[1] || "";
          fenceLines = [];
          continue;
        }

        if (!trimmed) {
          flushParagraph();
          flushList();
          continue;
        }

        const heading = line.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInlineMarkdown(heading[2].trim())}</h${level}>`);
          continue;
        }

        const quote = line.match(/^>\s?(.*)$/);
        if (quote) {
          flushParagraph();
          flushList();
          html.push(`<blockquote>${renderInlineMarkdown(quote[1])}</blockquote>`);
          continue;
        }

        const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        if (unordered || ordered) {
          flushParagraph();
          const type = ordered ? "ol" : "ul";
          if (listType && listType !== type) flushList();
          listType = type;
          listItems.push((unordered || ordered)[1]);
          continue;
        }

        flushList();
        paragraph.push(line);
      }

      if (inFence) flushFence();
      flushParagraph();
      flushList();
      return html.join("") || "<p></p>";
    }

    function renderInlineMarkdown(raw) {
      const placeholders = [];
      const protect = (value) => {
        const key = `\uE000${placeholders.length}\uE000`;
        placeholders.push([key, value]);
        return key;
      };

      let text = String(raw || "");
      text = text.replace(/`([^`]+)`/g, (_, code) => protect(`<code>${escapeHtml(code)}</code>`));
      text = text.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (match, label, url) => {
        const safeUrl = normalizeLinkUrl(url);
        if (!safeUrl) return match;
        return protect(`<a href="${escapeAttr(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`);
      });

      let html = escapeHtml(text);
      html = html
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/__(.+?)__/g, "<strong>$1</strong>")
        .replace(/~~(.+?)~~/g, "<del>$1</del>")
        .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
        .replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");

      for (const [key, value] of placeholders) {
        html = html.replaceAll(key, value);
      }
      return html;
    }

    function normalizeLinkUrl(url) {
      try {
        const parsed = new URL(String(url || "").trim(), location.href);
        return ["http:", "https:", "mailto:"].includes(parsed.protocol) ? parsed.href : "";
      } catch {
        return "";
      }
    }

    function appendStreamingDelta(kind, text) {
      if (!text) return;
      if (!streamingNodes) streamingNodes = {};
      if (kind === "reasoning") {
        if (!streamingNodes.reasoningText) {
          const block = createMessageBlock("reasoning", "", "reasoning");
          streamingNodes.reasoningRoot = block.root;
          streamingNodes.reasoningText = block.text;
          streamingNodes.reasoningCount = block.count;
          if (streamingNodes.contentRoot) {
            els.log.insertBefore(block.root, streamingNodes.contentRoot);
          } else {
            els.log.appendChild(block.root);
          }
        }
        streamingNodes.reasoningText.append(document.createTextNode(text));
        updateFoldCount(streamingNodes.reasoningCount, streaming.reasoning_content);
      } else {
        if (!streamingNodes.contentText) {
          const block = createMessageBlock("assistant", "", "assistant");
          streamingNodes.contentRoot = block.root;
          streamingNodes.contentText = block.text;
          els.log.appendChild(block.root);
        }
        queueStreamingMarkdownRender();
      }
      scrollLogToEnd();
    }

    function queueStreamingMarkdownRender() {
      if (streamingRenderFrame) return;
      streamingRenderFrame = requestAnimationFrame(() => {
        streamingRenderFrame = 0;
        if (!streaming || !streamingNodes || !streamingNodes.contentText) return;
        renderMessageText(streamingNodes.contentText, streaming.content, "assistant");
        scrollLogToEnd();
      });
    }

    function scrollLogToEnd() {
      els.log.scrollTop = els.log.scrollHeight;
    }

    function appendMessage(role, content) {
      messages.push({ role, content });
      renderMessage({ role, content });
      scrollLogToEnd();
    }

    function notice(text) {
      const current = els.status.innerHTML;
      els.status.innerHTML = `<span class="pill">${escapeHtml(text)}</span>${current}`;
      els.toast.textContent = text;
      els.toast.classList.add("visible");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        els.toast.classList.remove("visible");
      }, 2600);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("'", "&#39;");
    }

    els.connect.onclick = connect;
    els.logout.onclick = () => {
      manualDisconnect = true;
      clearReconnect();
      localStorage.removeItem("ddtuiRemoteToken");
      els.token.value = "";
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      ws = null;
      notice("logged out");
    };
    els.refresh.onclick = () => sendRaw({ kind: "list_sessions" });
    els.send.onclick = () => {
      const text = els.input.value.trim();
      if (!text) return;
      command("submit", { text });
      els.input.value = "";
    };
    els.steer.onclick = () => {
      const text = els.input.value.trim();
      if (!text) return;
      command("steer", { text });
      els.input.value = "";
    };
    els.interrupt.onclick = () => command("interrupt");
    els.snapshot.onclick = () => command("snapshot");
    els.newSession.onclick = () => {
      if (!activeSession) return notice("select a session first");
      const ok = confirm(
        "Start a fresh session? The current conversation is cleared, its " +
        "tasks/terminals/subagents are torn down, and AGENTS.md is re-read."
      );
      if (!ok) return;
      const known = new Set(sessions.map((s) => s.session_id));
      const cmdId = command("clear");
      if (cmdId) {
        pendingNewSession = { known, cmdId, until: Date.now() + 15000 };
      }
    };
    els.terminalRead.onclick = () => {
      const terminal_id = els.terminalSelect.value;
      if (!terminal_id) return;
      command("terminal_read", { terminal_id, offset: 0, max_chars: 12000 });
    };
    els.terminalSend.onclick = () => {
      const terminal_id = els.terminalSelect.value;
      const text = els.terminalInput.value;
      if (!terminal_id || !text) return;
      command("terminal_send", { terminal_id, text: `${text}\n`, wait_ms: 250 });
      els.terminalInput.value = "";
    };
    function isMobileComposer() {
      return (
        window.matchMedia("(max-width: 820px)").matches ||
        window.matchMedia("(pointer: coarse)").matches
      );
    }
    els.input.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        els.steer.click();
      } else if (event.key === "Enter" && !event.shiftKey) {
        if (isMobileComposer()) return;
        event.preventDefault();
        els.send.click();
      }
    });
    function setMobileTab(tab) {
      document.body.dataset.mobileTab = tab;
      for (const button of els.mobileTabs) {
        button.classList.toggle("active", button.dataset.mobileTab === tab);
      }
      if (tab === "sessions") {
        sendRaw({ kind: "list_sessions" });
      }
      if (tab === "terminal" && els.terminalPanel) {
        els.terminalPanel.open = true;
      }
      if (tab === "chat") {
        els.log.scrollTop = els.log.scrollHeight;
        els.input.focus({ preventScroll: true });
      }
    }
    for (const button of els.mobileTabs) {
      button.onclick = () => setMobileTab(button.dataset.mobileTab);
    }
  </script>
</body>
</html>
